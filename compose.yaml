name: home-infrastructure

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host

    environment:
      TZ: Europe/Stockholm

    volumes:
      - ${HA_CONFIG_DIR}:/config
      - /etc/localtime:/etc/localtime:ro

    stop_grace_period: 60s