- id: geronimo_glances_unavailable
  alias: "Geronimo - Glances unavailable"
  mode: single
  triggers:
    - trigger: template
      value_template: >
        {{ states('sensor.localhost_cpu_usage')
            in ['unavailable', 'unknown'] }}
      for: "00:03:00"
  actions:
    - action: notify.mobile_app_miquel_iphone
      data:
        title: "Geronimo - monitoring offline"
        message: "Home Assistant utracił dane z Glances przez ponad 3 minuty."
        data:
          tag: geronimo-glances

- id: geronimo_glances_recovered
  alias: "Geronimo - Glances recovered"
  mode: single
  triggers:
    - trigger: template
      value_template: >
        {{ is_number(states('sensor.localhost_cpu_usage')) }}
      for: "00:01:00"
  actions:
    - action: notify.mobile_app_miquel_iphone
      data:
        title: "Geronimo - monitoring restored"
        message: "Glances ponownie odpowiada. Monitoring serwera działa."
        data:
          tag: geronimo-glances

- id: geronimo_adguard_unavailable
  alias: "Geronimo - AdGuard unavailable"
  mode: single
  triggers:
    - trigger: template
      value_template: >
        {{ states('sensor.adguard_home_dns_queries')
           in ['unavailable', 'unknown'] }}
      for: "00:03:00"
  actions:
    - action: notify.mobile_app_miquel_iphone
      data:
        title: "Geronimo - AdGuard unavailable"
        message: "Home Assistant nie otrzymuje danych z AdGuard Home od ponad 3 minut."
        data:
          tag: geronimo-adguard

- id: geronimo_adguard_recovered
  alias: "Geronimo - AdGuard recovered"
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.adguard_home_dns_queries
      from: "unavailable"
  conditions:
    - condition: template
      value_template: >
        {{ is_number(states('sensor.adguard_home_dns_queries')) }}
  actions:
    - action: notify.mobile_app_miquel_iphone
      data:
        title: "Geronimo - AdGuard restored"
        message: "Home Assistant ponownie otrzymuje dane z AdGuard Home."
        data:
          tag: geronimo-adguard

- id: geronimo_adguard_dns_failed
  alias: "Geronimo - AdGuard DNS failed"
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.geronimo_adguard_dns_health
      to: "FAIL"
      for: "00:03:00"
  actions:
    - action: notify.mobile_app_miquel_iphone
      data:
        title: "Geronimo - DNS DOWN"
        message: "AdGuard nie rozwiązuje zapytań DNS od ponad 3 minut!"
        data:
          tag: geronimo-dns

- id: geronimo_adguard_dns_restored
  alias: "Geronimo - AdGuard DNS restored"
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.geronimo_adguard_dns_health
      from: "FAIL"
      to: "OK"
      for: "00:01:00"
  actions:
    - action: notify.mobile_app_miquel_iphone
      data:
        title: "Geronimo - DNS restored"
        message: "AdGuard ponownie prawidłowo rozwiązuje zapytania DNS."
        data:
          tag: geronimo-dns

