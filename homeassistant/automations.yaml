- id: geronimo_var_disk_warning
  alias: "GERONIMO - /var disk warning"
  description: "Alert when /var disk usage exceeds 80% for 5 minutes"
  mode: single

  triggers:
    - trigger: numeric_state
      entity_id: sensor.localhost_host_var_disk_usage
      above: 80
      for:
        minutes: 5

  actions:
    - action: notify.mobile_app_miquel_iphone
      data:
        title: "⚠️ GERONIMO - Disk warning"
        message: >-
          /var disk usage is {{ states('sensor.localhost_host_var_disk_usage') }}%.
          Threshold: 80%.
        data:
          tag: geronimo-var-disk

# MON-12: GERONIMO SYSTEM ALERTS

- id: geronimo_cpu_high
  alias: "GERONIMO - High CPU usage"
  triggers:
    - trigger: numeric_state
      entity_id: sensor.localhost_cpu_usage
      above: 90
      for:
        minutes: 10
  actions:
    - action: notify.mobile_app_miquel_iphone
      data:
        title: "GERONIMO - High CPU"
        message: >-
          CPU usage: {{ states('sensor.localhost_cpu_usage') }}%.
          Threshold: 90% for 10 minutes.
        data:
          tag: geronimo-cpu
  mode: single

- id: geronimo_cpu_temperature_high
  alias: "GERONIMO - CPU overheating"
  triggers:
