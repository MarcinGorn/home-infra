default_config:

homeassistant:
  name: Home
  country: SE
  time_zone: Europe/Stockholm
  unit_system: metric
  currency: SEK

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

lovelace:
  mode: storage
  dashboards:
    geronimo-system:
      mode: yaml
      title: Geronimo System Monitor
      icon: mdi:server
      show_in_sidebar: true
      filename: dashboards/geronimo.yaml

command_line:
  - sensor:
      name: "Geronimo AdGuard DNS Health"
      unique_id: geronimo_adguard_dns_health
      command: >-
        sh -c 'result=$(nslookup -type=A google.com 192.168.1.99 2>/dev/null);
        echo "$result" | grep -Eq "^Address: ([0-9]{1,3}\.){3}[0-9]{1,3}$"
        && echo OK || echo FAIL'
      scan_interval: 60
      command_timeout: 10