default_config:

homeassistant:
  name: Home
  country: SE
  time_zone: Europe/Stockholm
  unit_system: metric
  currency: SEK

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

lovelace:
  mode: storage
  dashboards:
    geronimo-system:
      mode: yaml
      title: Geronimo System Monitor
      icon: mdi:server
      show_in_sidebar: true
      filename: dashboards/geronimo.yaml